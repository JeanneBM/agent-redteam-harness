name: Red-team harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  offline:
    name: Unit tests and simulated targets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Validate bundled suite
        run: python -m redteam validate --suite cases/java-ci-triage
      - name: Hardened simulated target must PASS
        run: python -m redteam run --suite cases/java-ci-triage --target simulated:hardened --policy policy/thresholds.json --output reports/simulated-hardened
      - name: Naive simulated target must FAIL
        run: |
          set +e
          python -m redteam run --suite cases/java-ci-triage --target simulated:naive --policy policy/thresholds.json --output reports/simulated-naive
          code=$?
          set -e
          test "$code" -eq 1 || { echo "expected exit 1 (FAIL), got $code"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: simulated-reports
          path: reports/
          if-no-files-found: error

  java-ci-triage-demo:
    name: Live run against java-ci-triage-agent (demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JeanneBM/java-ci-triage-agent
          ref: main
          path: target-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: target-agent/pom.xml
      - name: Build the agent
        working-directory: target-agent
        run: mvn -B -ntp -q -DskipTests package
      - name: Start the agent in demo mode
        working-directory: target-agent
        run: |
          nohup java -jar target/*.jar > ../agent.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8080/triage; then
              echo "agent is up"; exit 0
            fi
            sleep 2
          done
          echo "agent did not start"; cat ../agent.log; exit 1
      - name: Red-team the agent
        run: python -m redteam run --suite cases/java-ci-triage --target java-ci-triage --base-url http://127.0.0.1:8080 --policy policy/thresholds.json --output reports/java-ci-triage-demo
      - name: Agent log on failure
        if: failure()
        run: tail -n 200 agent.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: java-ci-triage-demo-report
          path: reports/
          if-no-files-found: error

  aks-remediation-gate:
    name: Live run against the AKS remediation policy gate (offline fixture)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENTIC_OPS_REMEDIATION_TOKEN: redteam-token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: JeanneBM/azure-kubernetes-agentic-ops-eval
          ref: main
          path: target-agent
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the agent (its own pinned constraints)
        run: python -m pip install -q -c target-agent/constraints.txt ./target-agent
      - name: Start the remediation workload with an in-memory registry and a recording executor
        run: |
          nohup python targets/aks-remediation/serve.py --port 8081 > agent.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:8081/healthz; then echo "agent is up"; exit 0; fi
            sleep 1
          done
          echo "agent did not start"; cat agent.log; exit 1
      - name: Red-team the policy gate
        run: python -m redteam run --suite cases/aks-remediation --target aks-remediation --base-url http://127.0.0.1:8081 --policy policy/thresholds.json --output reports/aks-remediation
      - name: Exactly one action was executed (the control case)
        run: |
          curl -s http://127.0.0.1:8081/__redteam/executions | tee reports/aks-remediation/executions.json
          python - <<'PY'
          import json
          data = json.load(open("reports/aks-remediation/executions.json"))
          assert data["count"] == 1, f"expected 1 executed action, got {data['count']}: {data['actions']}"
          assert data["actions"][0]["parameters"]["new_image"] == "acrprod.azurecr.io/test-app:1.4.2"
          print("ok: only the intended fix was executed")
          PY
      - name: Agent log on failure
        if: failure()
        run: tail -n 200 agent.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: aks-remediation-report
          path: reports/
          if-no-files-found: error
