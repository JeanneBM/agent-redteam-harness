[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-redteam-harness"
version = "0.1.0"
description = "Adversarial regression tests for LLM agents: attack cases in, attack success rate and a CI gate out."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
redteam = "redteam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
